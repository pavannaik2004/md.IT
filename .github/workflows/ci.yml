name: CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'gateway/**'
      - 'mysql/**'
      - 'docker-compose.yml'
      - 'k8s/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'scripts/export_openapi.py'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - 'mysql/**'
              - 'scripts/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            k8s:
              - 'k8s/**'
              - 'scripts/*.sh'
              - 'scripts/lib/**'
              - 'scripts/check_aks_overlay.py'
              - '.github/workflows/ci.yml'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types are current (P-076)
        run: npm run api:types && git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build image (no push)
        run: docker build -t mdit-frontend:ci .

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      # The repo's own Compose services: CI gets the mdit_test init script and Azurite's
      # --skipApiVersionCheck, which GitHub service containers can't pass (P-054).
      - name: Start MySQL and Azurite
        working-directory: .
        run: docker compose up -d --wait mysql azurite
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: backend
          enable-cache: true
          # Relative to working-directory.
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - name: Tests (services required)
        run: uv run pytest
        env:
          MDIT_REQUIRE_SERVICES: '1'
      - name: OpenAPI document is current (P-076)
        run: uv run python ../scripts/export_openapi.py > ../frontend/src/api/openapi.json && git diff --exit-code -- ../frontend/src/api/openapi.json
      - name: Build image (no push)
        run: docker build -t mdit-backend:ci .
      - name: Service logs
        if: failure()
        working-directory: .
        run: docker compose logs mysql azurite

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start the whole stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Check through the gateway
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/api/health/ready
      - name: API smoke (save on one browser, restore on another)
        run: python3 scripts/api_smoke.py http://localhost:8080
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v

  k8s:
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render the local and AKS overlays
        run: |
          cp k8s/overlays/local/secret.example.env k8s/overlays/local/secret.env
          kubectl kustomize k8s/overlays/local > rendered.yaml
          kubectl kustomize k8s/overlays/aks > rendered-aks.yaml
          kubectl kustomize k8s/base > /dev/null
      - name: AKS overlay matches the Phase 7 spec
        run: |
          python3 -m pip install --quiet pyyaml==6.0.3
          python3 scripts/check_aks_overlay.py rendered-aks.yaml
      - name: No dev login (P-058)
        run: |
          if grep -rn --include='*.yaml' --include='*.env' 'DEV_LOGIN' rendered.yaml rendered-aks.yaml k8s infra; then exit 1; fi
      - name: Every image has an explicit tag or digest, never latest (PRD 11)
        run: |
          status=0
          # Image references never contain spaces, so word splitting is what we want.
          # shellcheck disable=SC2013
          for img in $(grep -hoE 'image: *"?[^" ]+' rendered.yaml rendered-aks.yaml | sed -E 's/image: *"?//'); do
            name=${img##*/}
            case "$img" in *@sha256:*) continue ;; esac
            case "$name" in
              *:latest) echo "latest tag: $img"; status=1 ;;
              *:*) ;;
              *) echo "no tag: $img"; status=1 ;;
            esac
          done
          exit $status
      - name: Script checks
        run: |
          for f in scripts/*.sh scripts/lib/*.sh; do sh -n "$f"; done
          shellcheck -x scripts/*.sh scripts/lib/*.sh
