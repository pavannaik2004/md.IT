# Local cluster only: the Blob Storage emulator, as in Compose.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: azurite-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azurite
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: azurite
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azurite
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: azurite
          image: mcr.microsoft.com/azure-storage/azurite:3.37.0
          # azure-storage-blob 12.31 sends an API version Azurite 3.37 doesn't know yet (P-054).
          command: ["azurite-blob", "--blobHost", "0.0.0.0", "--location", "/data", "--skipApiVersionCheck"]
          ports:
            - name: blob
              containerPort: 10000
          readinessProbe:
            tcpSocket:
              port: blob
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: azurite-data
---
apiVersion: v1
kind: Service
metadata:
  name: azurite
spec:
  selector:
    app.kubernetes.io/name: azurite
  ports:
    - name: blob
      port: 10000
      targetPort: blob
