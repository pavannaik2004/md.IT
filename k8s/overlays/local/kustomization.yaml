# Docker Desktop's Kubernetes (kubeadm mode): the base plus in-cluster MySQL and Azurite.
# On AKS these are Azure Database for MySQL and a Storage Account instead (Phase 7).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mdit

resources:
  - ../../base
  - mysql.yaml
  - azurite.yaml

configMapGenerator:
  - name: mdit-config
    behavior: merge
    literals:
      - DB_HOST=mysql
      - PUBLIC_BASE_URL=http://localhost

# The images `docker compose build` makes; AKS names ACR images tagged with the commit SHA.
images:
  - name: mdit-backend
    newTag: local
  - name: mdit-frontend
    newTag: local

# secret.env is git-ignored; scripts/k8s_local.sh up creates it from secret.example.env.
secretGenerator:
  - name: mdit-secrets
    envs:
      - secret.env
