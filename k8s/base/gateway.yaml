# Routing (PRD 10.2) with the Gateway API on Envoy Gateway; ingress-nginx, which the PRD
# names, was retired upstream in March 2026. The GatewayClass `eg` is a cluster add-on
# (k8s/cluster/), installed with Envoy Gateway itself.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mdit
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
# Everything under /api goes to the backend; the longest matching prefix wins across routes.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs:
    - name: mdit
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 8000
---
# Sign-in redirects: rate-limited tightly per client (PRD 12).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-signin
spec:
  parentRefs:
    - name: mdit
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/auth/login
        - path:
            type: PathPrefix
            value: /api/auth/callback
      backendRefs:
        - name: backend
          port: 8000
---
# Image uploads: one request per image in a save, so the limit is generous.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-upload
spec:
  parentRefs:
    - name: mdit
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/blobs
          method: PUT
      backendRefs:
        - name: backend
          port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs:
    - name: mdit
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
